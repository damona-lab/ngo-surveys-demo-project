[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Read by scripts/build.mjs (esbuild) so the bundle calls the Render API directly.
  VITE_API_BASE_URL = "https://ngo-surveys-demo-project.onrender.com"

# Only used if VITE_API_BASE_URL above is ever cleared, so /api stays reachable from this site.
[[redirects]]
  from = "/api/*"
  to = "https://ngo-surveys-demo-project.onrender.com/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200