# Netlify build config for the NGO Surveys frontend.
# The backend (API + MongoDB) is hosted separately on Render. The bundle is built
# pointing at the API via VITE_API_BASE_URL, which is injected at build time — set it
# to your new service's public URL before deploying (e.g. https://your-site.onrender.com).

[build]
  # Install deps, then compile src/ -> dist/ with the backend URL baked in.
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # URL the frontend bundle calls the API from. Read by scripts/build.mjs.
  # Override in the Netlify UI or with `netlify env:set VITE_API_BASE_URL <url>`.
  VITE_API_BASE_URL = ""

# Serve the built SPA from dist/. The Express server already emits dist/index.html,
# so no redirect rules are needed — Netlify handles SPA fallback automatically.