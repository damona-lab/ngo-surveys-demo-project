services:
  - type: web
    name: ngo-surveys
    runtime: node
    nodeVersion: "22"
    # Installs dependencies, then compiles src/ into dist/ via the Vite-free esbuild
    # build (scripts/build.mjs). Express serves dist/ and the API from one origin.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ngo_surveys
      - key: DB_SSL
        value: "true"
      # APP_URL is the public URL of the FRONTEND, because reset links are built as
      # `${APP_URL}/?reset=<token>` and the reset form lives in the frontend.
      # Example: https://your-site.netlify.app
      - key: APP_URL
        sync: false
      # FRONTEND_URL is the exact frontend origin (scheme + hostname, no path, no trailing
      # slash). The API only echoes CORS headers for origins listed here, and it accepts a
      # comma-separated list, e.g. https://your-site.netlify.app,http://localhost:5173
      - key: FRONTEND_URL
        sync: false
      # The Netlify frontend and this service are different sites, so the session cookie must
      # be SameSite=None; Secure, which is what CROSS_SITE_COOKIES=true enables. Set this back
      # to "false" only when the frontend is served from this same origin.
      - key: CROSS_SITE_COOKIES
        value: "true"
      # Render serves the prebuilt frontend from dist/ and the API from the same origin, so
      # the browser calls /api directly and no VITE_API_BASE_URL is needed here.
      # The frontend is hosted separately on Netlify, so VITE_API_BASE_URL is set to this
      # service's public URL and the bundle calls /api on this origin.
      - key: VITE_API_BASE_URL
        sync: false
        value: https://ngo-surveys-db.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      # Port 587 upgrades a plain connection with STARTTLS, so secure must stay false.
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
