services:
  - type: web
    name: ngo-surveys
    runtime: node
    # Installs dependencies, then compiles src/ into dist/ via the Vite-free esbuild
    # build (scripts/build.mjs). Express serves dist/ and the API from one origin.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ngo_surveys
      - key: DB_SSL
        value: "true"
      # Leave blank on Render to use RENDER_EXTERNAL_URL. Set this only for a custom frontend URL.
      - key: APP_URL
        value: ""
      # Optional allowed origins when using a separately hosted frontend.
      - key: FRONTEND_URL
        value: ""
      # Same-origin hosting uses a strict secure session cookie.
      - key: CROSS_SITE_COOKIES
        value: "false"
      # Render serves the prebuilt frontend from dist/ and the API from the same origin, so
      # Same-origin Render deployment: frontend and API share this service.
      - key: VITE_API_BASE_URL
        value: ""
      - key: NODE_VERSION
        value: "22.22.0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      # Port 587 upgrades a plain connection with STARTTLS, so secure must stay false.
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
