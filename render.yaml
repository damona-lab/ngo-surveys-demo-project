services:
  - type: web
    name: ngo-surveys
    runtime: node
    # Installs dependencies, then compiles src/ into dist/ via the Vite-free esbuild
    # build (scripts/build.mjs). Express serves dist/ and the API from one origin.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ngo_surveys
      - key: DB_SSL
        value: "true"
      # Use the frontend origin here when frontend hosting is separate.
      - key: APP_URL
        value: "https://ngo-surveyskenya.onrender.com"
      # Set to the exact frontend origin(s), comma-separated, e.g. https://your-site.netlify.app.
      - key: FRONTEND_URL
        value: ""
      # Required for session cookies when the frontend is hosted on another domain.
      - key: CROSS_SITE_COOKIES
        value: "true"
      # Render serves the prebuilt frontend from dist/ and the API from the same origin, so
      # the build-time base URL stays empty for a same-origin Render deployment.
      - key: VITE_API_BASE_URL
        value: ""
      - key: NODE_VERSION
        value: "22.22.0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      # Port 587 upgrades a plain connection with STARTTLS, so secure must stay false.
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
