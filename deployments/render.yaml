services:
  - type: web
    name: ngo-surveys
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ngo_surveys
      - key: DB_SSL
        value: "true"
      - key: APP_URL
        value: https://ngo-surveys-demo-project.onrender.com
      - key: FRONTEND_URL
        value: https://ngo-surveys-demo-project.onrender.com
      - key: CROSS_SITE_COOKIES
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://ngo-surveys-demo-project.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
